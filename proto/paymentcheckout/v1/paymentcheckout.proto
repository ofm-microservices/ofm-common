syntax = "proto3";

// Package paymentcheckout.v1 defines the synchronous checkout-session contract
// used by order-saga-service and payment-service.
package paymentcheckout.v1;

option go_package = "github.com/ofm-microservices/ofm-common/proto/paymentcheckout/v1;paymentcheckoutv1";

// PaymentCheckoutService owns checkout-session creation.
service PaymentCheckoutService {
  rpc CreateCheckoutSession(CreateCheckoutSessionRequest) returns (CreateCheckoutSessionResponse);
}

message CreateCheckoutSessionRequest {
  string saga_id = 1;
  string order_id = 2;
  string buyer_user_id = 3;
  string seller_user_id = 4;
  int64 amount_cents = 5;
  string currency = 6;
  string title = 7;
  string idempotency_key = 8;
  string requested_at = 9;
}

message CreateCheckoutSessionResponse {
  string order_id = 1;
  string payment_id = 2;
  string checkout_url = 3;
  string stripe_payment_intent_id = 4;
  string status = 5;
  string occurred_at = 6;
}
