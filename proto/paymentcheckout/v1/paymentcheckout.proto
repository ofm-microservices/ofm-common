syntax = "proto3";

// Package paymentcheckout.v1 defines the synchronous checkout-session contract
// used by order-saga-service and payment-service.
package paymentcheckout.v1;

option go_package = "github.com/ofm-microservices/ofm-common/proto/paymentcheckout/v1;paymentcheckoutv1";

// PaymentCheckoutService owns checkout-session creation.
service PaymentCheckoutService {
  rpc CreateCheckoutSession(CreateCheckoutSessionRequest) returns (CreateCheckoutSessionResponse);
  rpc ReleaseFunds(ReleaseFundsRequest) returns (ReleaseFundsResponse);
  rpc SettleDispute(SettleDisputeRequest) returns (SettleDisputeResponse);
  rpc GetReleaseByOrderId(GetReleaseByOrderIdRequest) returns (GetReleaseByOrderIdResponse);
  rpc GetPaymentByOrderId(GetPaymentByOrderIdRequest) returns (GetPaymentByOrderIdResponse);
}

message CreateCheckoutSessionRequest {
  string saga_id = 1;
  string order_id = 2;
  string buyer_user_id = 3;
  string seller_user_id = 4;
  int64 amount_cents = 5;
  string currency = 6;
  string title = 7;
  string idempotency_key = 8;
  string requested_at = 9;
}

message CreateCheckoutSessionResponse {
  string order_id = 1;
  string payment_id = 2;
  string checkout_url = 3;
  string stripe_payment_intent_id = 4;
  string status = 5;
  string occurred_at = 6;
}

message ReleaseFundsRequest {
  string order_id = 1;
  string payment_id = 2;
  string seller_user_id = 3;
  int64 amount_cents = 4;
  string currency = 5;
  string idempotency_key = 6;
  string requested_at = 7;
}

message ReleaseFundsResponse {
  string order_id = 1;
  string payment_release_id = 2;
  string stripe_transfer_id = 3;
  string status = 4;
  string occurred_at = 5;
}

message SettleDisputeRequest {
  string order_id = 1;
  string payment_id = 2;
  string seller_user_id = 3;
  int64 amount_cents = 4;
  string currency = 5;
  int32 freelancer_percentage = 6;
  int32 customer_percentage = 7;
  string idempotency_key = 8;
  string requested_at = 9;
}

message SettleDisputeResponse {
  string order_id = 1;
  string payment_release_id = 2;
  string stripe_transfer_id = 3;
  string stripe_refund_id = 4;
  int64 freelancer_amount_cents = 5;
  int64 customer_amount_cents = 6;
  string status = 7;
  string occurred_at = 8;
}

message GetReleaseByOrderIdRequest {
  string order_id = 1;
}

message GetReleaseByOrderIdResponse {
  string order_id = 1;
  string payment_release_id = 2;
  string payment_intent_id = 3;
  string seller_user_id = 4;
  int64 amount_cents = 5;
  string currency = 6;
  string idempotency_key = 7;
  string stripe_transfer_id = 8;
  string status = 9;
  string failure_reason = 10;
  string occurred_at = 11;
}

message GetPaymentByOrderIdRequest {
  string order_id = 1;
}

message GetPaymentByOrderIdResponse {
  string payment_id = 1;
  int64 amount_cents = 2;
  string currency = 3;
  string created_at = 4;
  string updated_at = 5;
}
