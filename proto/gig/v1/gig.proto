syntax = "proto3";

// Package gig.v1 defines the gig draft and publish workflow shared between
// api-gateway and gig-service.
package gig.v1;

option go_package = "github.com/ofm-microservices/ofm-common/proto/gig/v1;gigv1";

// GigCommandService exposes the gig draft workflow over gRPC.
service GigCommandService {
  rpc CreateDraft(CreateDraftRequest) returns (CreateDraftResponse);
  rpc UpdateBasicInfo(UpdateBasicInfoRequest) returns (UpdateBasicInfoResponse);
  rpc ReplacePackages(ReplacePackagesRequest) returns (ReplacePackagesResponse);
  rpc ReplaceQuestions(ReplaceQuestionsRequest) returns (ReplaceQuestionsResponse);
  rpc ReplaceMedia(ReplaceMediaRequest) returns (ReplaceMediaResponse);
  rpc GetDraft(GetDraftRequest) returns (GetDraftResponse);
  rpc GetOrderStartSnapshot(GetOrderStartSnapshotRequest) returns (GetOrderStartSnapshotResponse);
  rpc GetGigBySlug(GetGigBySlugRequest) returns (GetGigBySlugResponse);
  rpc GetPreviewGigsByFreelancerUsername(GetPreviewGigsByFreelancerUsernameRequest) returns (GetPreviewGigsByFreelancerUsernameResponse);
  rpc Publish(PublishRequest) returns (PublishResponse);
}

message Gig {
  string gig_id = 1;
  string freelancer_id = 2;
  string seller_username = 3;
  string slug = 4;
  string title = 5;
  string short_info = 6;
  string description = 7;
  int64 category_id = 8;
  string currency = 9;
  string status = 10;
  bool basic_info_completed = 11;
  bool packages_completed = 12;
  bool requirements_completed = 13;
  bool media_completed = 14;
  string picture_file_id = 15;
  string picture_url = 16;
  string published_at = 17;
  string created_at = 18;
  string updated_at = 19;
  repeated GigPackage packages = 20;
  repeated GigQuestion questions = 21;
  repeated GigMedia media = 22;
}

message GigPackage {
  string id = 1;
  string gig_id = 2;
  string tier = 3;
  reserved 4;
  string description = 5;
  int32 delivery_days = 6;
  int64 price_cents = 7;
  int32 sort_order = 8;
}

message GigQuestion {
  string id = 1;
  string gig_id = 2;
  string content = 3;
  int32 sort_order = 4;
}

message GigMedia {
  string id = 1;
  string gig_id = 2;
  string file_id = 3;
  string url = 4;
  int32 sort_order = 5;
}

message MediaUpload {
  string filename = 1;
  string content_type = 2;
  bytes data = 3;
}

message CreateDraftRequest {
  string freelancer_id = 1;
}

message CreateDraftResponse {
  Gig gig = 1;
}

message UpdateBasicInfoRequest {
  string gig_id = 1;
  string freelancer_id = 2;
  string title = 3;
  string short_info = 4;
  string description = 5;
  int64 category_id = 6;
  string currency = 7;
}

message UpdateBasicInfoResponse {
  Gig gig = 1;
}

message ReplacePackagesRequest {
  string gig_id = 1;
  string freelancer_id = 2;
  repeated GigPackage packages = 3;
}

message ReplacePackagesResponse {
  Gig gig = 1;
}

message ReplaceQuestionsRequest {
  string gig_id = 1;
  string freelancer_id = 2;
  repeated GigQuestion questions = 3;
}

message ReplaceQuestionsResponse {
  Gig gig = 1;
}

message ReplaceMediaRequest {
  string gig_id = 1;
  string freelancer_id = 2;
  repeated MediaUpload files = 3;
}

message ReplaceMediaResponse {
  Gig gig = 1;
}

message GetDraftRequest {
  string gig_id = 1;
  string freelancer_id = 2;
}

message GetDraftResponse {
  Gig gig = 1;
}

message OrderStartSnapshot {
  string gig_id = 1;
  string package_id = 2;
  string seller_user_id = 3;
  string seller_username = 4;
  string gig_title = 5;
  string package_title = 6;
  string package_description = 7;
  int64 price_cents = 8;
  string currency = 9;
  int32 delivery_days = 10;
  int32 revision_count = 11;
  bool gig_published = 12;
  bool package_available = 13;
  repeated GigQuestion questions = 14;
  string picture_file_id = 15;
}

message GetOrderStartSnapshotRequest {
  string gig_id = 1;
  string package_id = 2;
}

message GetOrderStartSnapshotResponse {
  OrderStartSnapshot snapshot = 1;
}

message GetGigBySlugRequest {
  string slug = 1;
}

message GetGigBySlugResponse {
  Gig gig = 1;
}

message GetPreviewGigsByFreelancerUsernameRequest {
  string username = 1;
  string cursor = 2;
}

message GigPreview {
  string gig_id = 1;
  string slug = 2;
  string title = 3;
  string short_info = 4;
  int64 minimum_price_cents = 5;
  string picture_url = 6;
  string created_at = 7;
}

message GetPreviewGigsByFreelancerUsernameResponse {
  repeated GigPreview gigs = 1;
  string cursor = 2;
  bool has_more = 3;
}

message PublishRequest {
  string gig_id = 1;
  string freelancer_id = 2;
  string username = 3;
}

message PublishResponse {
  Gig gig = 1;
}
